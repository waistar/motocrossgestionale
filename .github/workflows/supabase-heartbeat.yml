name: Supabase heartbeat

on:
  schedule:
    # Due query al giorno, alle 06:17 e alle 18:17 UTC.
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Query Supabase
        run: python3 scripts/supabase_heartbeat.py
